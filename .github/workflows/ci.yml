name: Android CI

on:
  push:
    branches: [main, 'stage/**']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify frozen finance core lock
        run: ./scripts/verify_finance_lock.sh
      - name: Verify unit tests, lint, and debug APK
        run: ./gradlew --no-daemon clean test :core:database:testDebugUnitTest :core:database:assembleAndroidTest lintDebug :app:assembleDebug
      - name: Verify fixed development signing certificate
        shell: bash
        run: |
          ACTUAL_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="A034087FD9D4DE4669715C518D244AE7A534676CC0AAB44B05BA0A8EE5E139B7"
          echo "SaiETF development certificate SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
      - name: Verify in-place upgrade install contract
        run: bash ./scripts/verify_upgrade_install_contract.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify previous published APK to current APK update invariants
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_COMMIT="$(sed -n 's/^previousVerifiedCommit=//p' app/upgrade-install-contract.properties | tail -n 1)"
          test -n "$BASELINE_COMMIT"
          UPGRADE_DIR="$RUNNER_TEMP/saietf-upgrade"
          BASELINE_DIR="$RUNNER_TEMP/saietf-baseline"
          mkdir -p "$UPGRADE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$UPGRADE_DIR/current.apk"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_COMMIT"
          (
            cd "$BASELINE_DIR"
            ./gradlew --no-daemon :app:assembleDebug
          )
          cp "$BASELINE_DIR/app/build/outputs/apk/debug/app-debug.apk" "$UPGRADE_DIR/baseline.apk"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify "$UPGRADE_DIR/baseline.apk"
          "$APKSIGNER" verify "$UPGRADE_DIR/current.apk"

          BASELINE_BADGING="$("$AAPT" dump badging "$UPGRADE_DIR/baseline.apk" | head -n 1)"
          CURRENT_BADGING="$("$AAPT" dump badging "$UPGRADE_DIR/current.apk" | head -n 1)"
          BASELINE_PACKAGE="$(printf '%s\n' "$BASELINE_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          CURRENT_PACKAGE="$(printf '%s\n' "$CURRENT_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          BASELINE_VERSION_CODE="$(printf '%s\n' "$BASELINE_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          CURRENT_VERSION_CODE="$(printf '%s\n' "$CURRENT_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          BASELINE_CERT="$("$APKSIGNER" verify --print-certs "$UPGRADE_DIR/baseline.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          CURRENT_CERT="$("$APKSIGNER" verify --print-certs "$UPGRADE_DIR/current.apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"

          echo "baseline package=$BASELINE_PACKAGE versionCode=$BASELINE_VERSION_CODE cert=$BASELINE_CERT"
          echo "current  package=$CURRENT_PACKAGE versionCode=$CURRENT_VERSION_CODE cert=$CURRENT_CERT"

          test "$CURRENT_PACKAGE" = "$BASELINE_PACKAGE"
          test "$CURRENT_CERT" = "$BASELINE_CERT"
          test "$CURRENT_PACKAGE" = "tw.saietf.app"
          test "$BASELINE_VERSION_CODE" -lt "$CURRENT_VERSION_CODE"
          echo "ANDROID_IN_PLACE_UPDATE_COMPATIBILITY=PASS"
      - name: Enable KVM for Room migration test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android update preserves app data and Room migration
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/saietf-upgrade/baseline.apk"
            adb shell am start -W -n tw.saietf.app/.MainActivity
            sleep 4
            adb shell "run-as tw.saietf.app test -f databases/saietf.db"
            adb shell "run-as tw.saietf.app sh -c 'mkdir -p files; echo SAIETF_UPGRADE_PRESERVE > files/upgrade-marker.txt'"
            adb install -r "$RUNNER_TEMP/saietf-upgrade/current.apk"
            adb shell am force-stop tw.saietf.app
            adb shell am start -W -n tw.saietf.app/.MainActivity
            sleep 4
            adb shell pidof tw.saietf.app
            test "$(adb shell run-as tw.saietf.app cat files/upgrade-marker.txt | tr -d '\r')" = "SAIETF_UPGRADE_PRESERVE"
            adb shell "run-as tw.saietf.app test -f databases/saietf.db"
            ./gradlew --no-daemon :core:database:connectedDebugAndroidTest
            echo "ANDROID_ROOM_MIGRATION_AND_DATA_PRESERVATION=PASS"
      - name: Generate Room schema artifact bytes
        run: ./gradlew --no-daemon :core:database:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-Room-schema-v3
          path: core/database/schemas
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload V1.0.59 APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-V1.0.59-fugle-websocket-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android CI commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE="failure"
          DESCRIPTION="Android CI failed before APK verification completed"
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="All gates passed and APK artifact uploaded"
          fi
          TARGET_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PAYLOAD="$(printf '{"state":"%s","context":"saietf/android-ci","description":"%s","target_url":"%s"}' "$STATE" "$DESCRIPTION" "$TARGET_URL")"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$PAYLOAD"
