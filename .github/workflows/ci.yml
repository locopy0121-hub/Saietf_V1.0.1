name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify frozen finance fixtures are reproducible
        run: |
          rm -rf /tmp/v378-a /tmp/v378-b
          node tools/tf-v378/export-fixtures.mjs /tmp/v378-a
          node tools/tf-v378/export-fixtures.mjs /tmp/v378-b
          diff -ru /tmp/v378-a /tmp/v378-b
          diff -ru core/finance/src/test/resources/v378 /tmp/v378-a
      - name: Verify unit tests, lint, and debug APK
        run: ./gradlew --no-daemon clean test lintDebug :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-V1.0.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
