name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify frozen finance core lock
        run: ./scripts/verify_finance_lock.sh
      - name: Verify unit tests, lint, and debug APK
        run: ./gradlew --no-daemon clean test :core:database:testDebugUnitTest :core:database:assembleAndroidTest lintDebug :app:assembleDebug
      - name: Verify fixed development signing certificate
        shell: bash
        run: |
          ACTUAL_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="A034087FD9D4DE4669715C518D244AE7A534676CC0AAB44B05BA0A8EE5E139B7"
          echo "SaiETF development certificate SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
      - name: Generate Room schema artifact bytes
        run: ./gradlew --no-daemon :core:database:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-Room-schema-v1
          path: core/database/schemas
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload V1.0.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-V1.0.7-market-center-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
