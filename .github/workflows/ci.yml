name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify frozen finance core lock
        run: ./scripts/verify_finance_lock.sh
      - name: Verify unit tests, lint, and debug APK
        run: ./gradlew --no-daemon clean test :core:database:testDebugUnitTest :core:database:assembleAndroidTest lintDebug :app:assembleDebug
      - name: Verify fixed development signing certificate
        shell: bash
        run: |
          ACTUAL_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="A034087FD9D4DE4669715C518D244AE7A534676CC0AAB44B05BA0A8EE5E139B7"
          echo "SaiETF development certificate SHA-256: $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
      - name: Verify in-place upgrade install contract
        run: bash ./scripts/verify_upgrade_install_contract.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Build previous verified APK for real upgrade test
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_COMMIT="$(sed -n 's/^previousVerifiedCommit=//p' app/upgrade-install-contract.properties | tail -n 1)"
          test -n "$BASELINE_COMMIT"
          UPGRADE_DIR="$RUNNER_TEMP/saietf-upgrade"
          BASELINE_DIR="$RUNNER_TEMP/saietf-baseline"
          mkdir -p "$UPGRADE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$UPGRADE_DIR/current.apk"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_COMMIT"
          (
            cd "$BASELINE_DIR"
            ./gradlew --no-daemon :app:assembleDebug
          )
          cp "$BASELINE_DIR/app/build/outputs/apk/debug/app-debug.apk" "$UPGRADE_DIR/baseline.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$UPGRADE_DIR/baseline.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$UPGRADE_DIR/current.apk"
      - name: Enable KVM for Android update test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Android in-place update and data preservation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -euo pipefail
            UPGRADE_DIR="$RUNNER_TEMP/saietf-upgrade"
            adb install "$UPGRADE_DIR/baseline.apk"
            adb shell run-as tw.saietf.app mkdir -p files
            adb shell run-as tw.saietf.app sh -c 'echo SAIETF_UPGRADE_PRESERVE > files/upgrade-marker.txt'
            adb install -r "$UPGRADE_DIR/current.apk"
            MARKER="$(adb shell run-as tw.saietf.app cat files/upgrade-marker.txt | tr -d '\r')"
            test "$MARKER" = "SAIETF_UPGRADE_PRESERVE"
            PACKAGE_INFO="$(adb shell dumpsys package tw.saietf.app | tr -d '\r')"
            echo "$PACKAGE_INFO" | grep -q 'versionCode=10008'
            echo "ANDROID_IN_PLACE_UPDATE_GATE=PASS"
      - name: Generate Room schema artifact bytes
        run: ./gradlew --no-daemon :core:database:kspDebugKotlin --rerun-tasks
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-Room-schema-v1
          path: core/database/schemas
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload V1.0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: SaiETF-V1.0.8-upgrade-safe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
