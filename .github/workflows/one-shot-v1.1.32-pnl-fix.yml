name: One-shot V1.1.32 realtime PnL fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-v1.1.32-pnl-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V1.1.32 PnL correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'core/market/src/main/kotlin/tw/saietf/core/market/PortfolioMarketValuator.kt',
              '''            val today = quote?.previousClose
                ?.takeIf { it.isFinite() && it > 0.0 }
                ?.let { previous ->
                    val priorValue = floor(holding.shares.toDouble() * previous).toLong()
                    marketValue?.minus(priorValue)
                }
''',
              '''            val today = quote?.let { currentQuote ->
                val previous = currentQuote.previousClose
                    ?.takeIf { it.isFinite() && it > 0.0 }
                if (previous == null) {
                    0L
                } else {
                    val priorValue = floor(holding.shares.toDouble() * previous).toLong()
                    marketValue?.minus(priorValue) ?: 0L
                }
            }
''',
          )

          test_path = Path('core/market/src/test/kotlin/tw/saietf/core/market/PortfolioMarketValuatorTest.kt')
          test_text = test_path.read_text()
          marker = '\n}\n'
          if not test_text.endswith(marker):
              raise SystemExit('PortfolioMarketValuatorTest closing marker missing')
          new_test = r'''

    @Test
    fun `complete realtime quotes treat missing previous close as zero today pnl`() {
        val valuation = PortfolioMarketValuator().value(
            holdings = listOf(
                HoldingCost("0050", 100L, 5_500.0),
                HoldingCost("2330", 2L, 2_000.0),
            ),
            quotes = mapOf(
                "0050" to MarketQuote(
                    symbol = "0050",
                    price = 60.0,
                    previousClose = 59.0,
                    asOfEpochMillis = 1L,
                    source = MarketSource.FUGLE,
                ),
                "2330" to MarketQuote(
                    symbol = "2330",
                    price = 1_100.0,
                    previousClose = null,
                    asOfEpochMillis = 1L,
                    source = MarketSource.FUGLE,
                ),
            ),
        )

        assertTrue(valuation.isComplete)
        assertEquals(100L, valuation.todayPnl)
        assertEquals(0L, valuation.holdings.single { it.symbol == "2330" }.todayPnl)
        assertEquals(700.0, valuation.totalPnl ?: 0.0, 0.0)
    }
'''
          test_path.write_text(test_text[:-len(marker)] + new_test + marker)

          build_test = Path('app/src/test/kotlin/tw/saietf/app/BuildContractTest.kt')
          bt = build_test.read_text()
          bt = bt.replace(
              'import java.io.File\n',
              'import java.io.File\nimport java.util.Properties\n',
              1,
          )
          old_identity = '''        assertEquals("tw.saietf.app", BuildConfig.APPLICATION_ID)
        assertEquals("1.1.31", BuildConfig.VERSION_NAME)
        assertEquals(10131, BuildConfig.VERSION_CODE)
        assertEquals("zh-Hant-TW", SaiEtfApplication.DEFAULT_LOCALE_TAG)
'''
          new_identity = '''        val versionProperties = Properties().apply {
            File("version.properties").inputStream().use { load(it) }
        }
        assertEquals("tw.saietf.app", BuildConfig.APPLICATION_ID)
        assertEquals(versionProperties.getProperty("versionName"), BuildConfig.VERSION_NAME)
        assertEquals(versionProperties.getProperty("versionCode").toInt(), BuildConfig.VERSION_CODE)
        assertEquals("zh-Hant-TW", SaiEtfApplication.DEFAULT_LOCALE_TAG)
'''
          if old_identity not in bt:
              raise SystemExit('BuildContract version identity anchor missing')
          build_test.write_text(bt.replace(old_identity, new_identity, 1))

          replace_exact('app/version.properties', 'versionName=1.1.31\nversionCode=10131', 'versionName=1.1.32\nversionCode=10132')
          replace_exact('app/build.gradle.kts', 'versionCode = 10131', 'versionCode = 10132')
          replace_exact('app/build.gradle.kts', 'versionName = "1.1.31"', 'versionName = "1.1.32"')

          Path('app/upgrade-baseline.properties').write_text(
              'previousVerifiedVersionName=1.1.31\n'
              'previousVerifiedVersionCode=10131\n'
              'previousVerifiedCommit=c935de799a49f25cf6a0d6dcc7c9f09e3466a4c0\n'
          )

          replace_exact('.github/workflows/ci.yml', 'Upload V1.1.31 APK', 'Upload V1.1.32 APK')
          replace_exact(
              '.github/workflows/ci.yml',
              'SaiETF-V1.1.31-one-tap-dividend-import-apk',
              'SaiETF-V1.1.32-realtime-today-pnl-apk',
          )

          Path('.github/workflows/one-shot-v1.1.32-pnl-fix.yml').unlink()
          PY
      - name: Commit patched V1.1.32
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: publish realtime today pnl v1.1.32'
          git push origin HEAD:main
